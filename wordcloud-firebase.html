<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CloudBase 文字雲</title>
    <link rel="stylesheet" href="public/styles.css">
    <script defer src="public/app.js?v=20260520-1115"></script>
  </head>
  <body>
    <main class="shell">
      <section class="compose" aria-label="新增文字">
        <div>
          <p class="kicker">Live CloudBase Word Cloud</p>
          <h1>文字雲</h1>
        </div>
        <form id="wordForm" class="word-form">
          <input id="wordInput" name="word" type="text" maxlength="24" autocomplete="off" placeholder="輸入一個詞">
          <button type="submit">加入</button>
        </form>
      </section>

      <section class="board" aria-live="polite">
        <div id="status" class="status">正在連接 CloudBase...</div>
        <div id="cloud" class="cloud" aria-label="文字雲"></div>
      </section>
    </main>
  </body>
</html>
