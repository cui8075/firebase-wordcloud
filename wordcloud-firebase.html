<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Firebase 文字雲</title>
    <link rel="stylesheet" href="public/styles.css">
    <script defer src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore-compat.js"></script>
    <script>
      window.addEventListener("load", function () {
        if (!window.firebase || firebase.apps.length) {
          return;
        }

        firebase.initializeApp({
          apiKey: "AIzaSyCPT1HjUWxDmpmYuUHOes7fvtal3CiBVJM",
          authDomain: "teacherstudy-2d61d.firebaseapp.com",
          projectId: "teacherstudy-2d61d",
          storageBucket: "teacherstudy-2d61d.firebasestorage.app",
          messagingSenderId: "822767333686"
        });
      });
    </script>
    <script defer src="public/app.js?v=20260519-1710"></script>
  </head>
  <body>
    <main class="shell">
      <section class="compose" aria-label="新增文字">
        <div>
          <p class="kicker">Live Firestore Word Cloud</p>
          <h1>文字雲</h1>
        </div>
        <form id="wordForm" class="word-form">
          <input id="wordInput" name="word" type="text" maxlength="24" autocomplete="off" placeholder="輸入一個詞">
          <button type="submit">加入</button>
        </form>
      </section>

      <section class="board" aria-live="polite">
        <div id="status" class="status">正在連接 Firebase...</div>
        <div id="cloud" class="cloud" aria-label="文字雲"></div>
      </section>
    </main>
  </body>
</html>
